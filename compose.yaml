name: bookreplay

services:
  bookreplay:
    image: ${BOOKREPLAY_IMAGE:-ghcr.io/loukag/bookreplay:v0.1.0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env; see .env.example}
      OPEN_LIBRARY_CONTACT_EMAIL: ${OPEN_LIBRARY_CONTACT_EMAIL:-}
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      SETUP_SECRET: ${SETUP_SECRET:-}
      RUST_LOG: ${RUST_LOG:-bookreplay_api=info}
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bookreplay
      POSTGRES_USER: bookreplay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env; see .env.example}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookreplay -d bookreplay"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
