services:
  api:
    build:
      context: .
      network: host
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://rekindle:rekindle@postgres:5432/rekindle
      OPEN_LIBRARY_CONTACT_EMAIL: ${OPEN_LIBRARY_CONTACT_EMAIL:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: .
          ignore:
            - My Clippings.txt

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rekindle
      POSTGRES_USER: rekindle
      POSTGRES_PASSWORD: rekindle
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rekindle -d rekindle"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
