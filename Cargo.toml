[package]
name = "rekindle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "rekindle-api"
path = "src/main.rs"

[dependencies]
rekindle-api = { path = "crates/api" }
tokio.workspace = true

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
axum = "0.8.9"
httpdate = "1.0.3"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8.6", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio-rustls"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "time"] }
tower-http = { version = "0.6.11", features = ["fs"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

rekindle-core = { path = "crates/core" }
rekindle-kindle = { path = "crates/kindle" }
rekindle-openlibrary = { path = "crates/openlibrary" }
