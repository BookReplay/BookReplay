[package]
name = "bookreplay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "bookreplay"
path = "src/main.rs"

[dependencies]
bookreplay-api = { path = "crates/api" }
tokio.workspace = true

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
argon2 = "0.6.0"
axum = "0.8.9"
axum-login = "0.18.0"
httpdate = "1.0.3"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8.6", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio-rustls", "time"] }
time = { version = "0.3.41", features = ["formatting", "macros", "serde", "serde-well-known"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6.11", features = ["fs"] }
tower-sessions = "0.14.0"
tower-sessions-sqlx-store = { version = "0.15.0", features = ["postgres"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

bookreplay-core = { path = "crates/core" }
bookreplay-kindle = { path = "crates/kindle" }
bookreplay-openlibrary = { path = "crates/openlibrary" }
