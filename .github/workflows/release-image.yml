name: Release image

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    # Only amd64 is supported until arm64 has the same runtime validation.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Select image name
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="sha-${GITHUB_SHA}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then tag="$GITHUB_REF_NAME"; fi
          echo "name=$image:$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ steps.image.outputs.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify fresh install and persistence
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: python3 scripts/smoke-install.py "$IMAGE"
      - name: Verify HTTPS setup and owner access security
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: python3 scripts/smoke-security.py "$IMAGE"
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: docker push "$IMAGE"
